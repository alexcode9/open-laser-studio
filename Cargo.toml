[workspace]
resolver = "3"
members = [
    "crates/laser-core",
    "crates/laser-geometry",
    "crates/laser-gcode",
    "crates/laser-motion",
    "crates/laser-protocol",
    "crates/laser-simulator",
    "crates/laser-devices",
    "crates/laser-jobs",
    "crates/laser-project",
    "crates/laser-node",
    "tools/simulator-cli",
    "tools/gcode-analyzer",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/open-laser-studio/open-laser-studio"
rust-version = "1.88"

[workspace.dependencies]
laser-core = { path = "crates/laser-core" }
laser-geometry = { path = "crates/laser-geometry" }
laser-gcode = { path = "crates/laser-gcode" }
laser-motion = { path = "crates/laser-motion" }
laser-protocol = { path = "crates/laser-protocol" }
laser-simulator = { path = "crates/laser-simulator" }
laser-devices = { path = "crates/laser-devices" }
laser-jobs = { path = "crates/laser-jobs" }
laser-project = { path = "crates/laser-project" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
usvg = "0.49"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.23"
crc = "3"
napi = { version = "3", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "3"
napi-build = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_arguments = "allow"

[profile.release]
lto = "thin"
